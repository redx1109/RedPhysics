<script>
(function(){
  // index.html-only elements. Drawer elements now exist on this page for real.
  var GONE = {levelChips:1,fieldChips:1,nextup:1,ringFill:1,progCount:1,progSub:1,
              chapters:1,pathsec:1,labsec:1,labBtn:1,tabs:1,labmount:1,cv:1,
              formula:1,labctx:1,lvl:1,ltitle:1,blurb:1,controls:1,btns:1,
              readouts:1,ltry:1,startBtn:1,savedBtn:1,savedCount:1,navSaved:1,
              bgmBtn:1,scrollbar:1};
  var stubs = {};
  function makeStub(){
    return {
      addEventListener:function(){}, removeEventListener:function(){},
      classList:{add:function(){},remove:function(){},toggle:function(){},contains:function(){return false}},
      style:{}, dataset:{}, setAttribute:function(){}, getAttribute:function(){return null},
      appendChild:function(){}, append:function(){}, remove:function(){},
      querySelector:function(){return null}, querySelectorAll:function(){return []},
      innerHTML:"", textContent:"", children:[], childNodes:[],
      focus:function(){}, blur:function(){}, scrollIntoView:function(){},
      getBoundingClientRect:function(){return {top:0,left:0,width:0,height:0,bottom:0,right:0}},
      offsetTop:0, offsetHeight:0, offsetWidth:0, offsetLeft:0
    };
  }
  var orig = document.getElementById;
  document.getElementById = function(id){
    var e = orig.call(document, id);
    if (e) return e;
    if (!GONE[id]) return null;
    return stubs[id] || (stubs[id] = makeStub());
  };
  var origQS = document.querySelector;
  document.querySelector = function(sel){
    var e = origQS.call(document, sel);
    if (e) return e;
    var m = sel.match(/^#([\w-]+)$/);
    return m && GONE[m[1]] ? (stubs[m[1]] || (stubs[m[1]] = makeStub())) : null;
  };
})();
</script>

<!-- ============ Open lessons in place ============ -->
<script>
(function(){
  function openInPlace(id){
    if (typeof openLesson === "function") openLesson(id);
    else if (window.Drawer && typeof Drawer.open === "function") Drawer.open(id);
    try{
      var t = "#lesson=" + encodeURIComponent(id);
      if (location.hash !== t) history.replaceState(null, "", location.pathname + location.search + t);
    }catch(e){}
  }

  // Intercept clicks on index.html#lesson=… or #lesson=… links produced by branches.js
  document.addEventListener("click", function(e){
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href") || "";
    var m = href.match(/(?:^|\/)index\.html(?:\?[^#]*)?#lesson=([^&]+)/)
          || href.match(/^#lesson=([^&]+)/);
    if (!m) return;
    var id = decodeURIComponent(m[1]);
    if (!window.byId || !byId[id]) return;   // unknown lesson → let default run
    e.preventDefault();
    openInPlace(id);
  });

  function isReload(){
    try{
      var n = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      return !!(n && n.type === "reload");
    }catch(e){ return false; }
  }

  function fromHash(){
    var m = location.hash.match(/^#lesson=(.+)$/);
    if (!m) return;
    // Don't reopen on a plain refresh — that was the complaint about index.html.
    if (isReload()){
      try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
      return;
    }
    var id = decodeURIComponent(m[1]);
    if (window.byId && byId[id]) openInPlace(id);
    else try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fromHash);
  else fromHash();
  addEventListener("hashchange", fromHash);
})();
</script>
